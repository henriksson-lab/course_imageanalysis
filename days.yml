# The course structure: parts, days, units and prerequisites.
# Single machine-readable source (plan/coursemap.md keeps the rationale).
# - Validate: make check-prereqs   - Regenerate the sidebar: make sidebar   (tools/days.py)
# - The per-page prerequisite boxes are added at render time by tools/prereqs.lua.
# Prerequisites: a plain id names a day; a name ending in "/" names a unit folder.
# hard = must come first (order is checked); soft = "see also" back-references.
# A unit lists only what it needs beyond its day (the previous unit of the day is implied).
# demos: sidebar labels for the exercise page anchors (anchors without a label get one
# from their heading). status: planned = not built yet (left out of the sidebar).

parts:
  - id: "I"
    title: "Images as numbers"
    colour: "#2a7f8f"
    tint: "#e6f3f5"
    days:
      - id: images
        number: 1
        title: "Images, filters and frequencies"
        hard: []
        soft: []
        owns:
          - "image = matrix, affine transforms and homogeneous coordinates, interpolation"
          - "convolution and border rules"
          - "the DFT, convolution theorem, sampling and aliasing"
          - "PCA (2D picture, covariance, eigenvectors)"
        units:
          - folder: images
            title: "Images as arrays & geometric transforms"
            demos:
              explore: "Demo"
          - folder: kernels
            title: "Filtering & convolution"
            demos:
              explore: "Demo"
          - folder: fourier
            title: "Images in frequency space"
            demos:
              explore-wave: "Demo: build a wave"
              explore: "Demo: filter an image"
          - folder: pca
            title: "Principal component analysis"
            demos:
              explore: "Demo"
      - id: edges
        number: 2
        title: "Edges, blobs and ridges"
        plan: "plan/edges-day.md"
        hard: [images]
        soft: []
        owns:
          - "Gaussian derivatives, LoG/DoG, Hessian, structure tensor, Canny, scale space"
          - "hysteresis (introduced inside Canny)"
        units:
          - folder: canny
            title: "Edges: Gaussian derivatives and Canny"
            demos:
              explore-gaussderiv: "Demo: smoothing before differentiating"
              explore: "Demo: Canny step by step"
          - folder: scale-space
            title: "Scale space, blobs and pyramids"
            demos:
              explore-scale1d: "Demo: a 1D scale space"
              explore: "Demo: blobs over scales"
          - folder: hessian
            title: "The Hessian: blobs, ridges and saddles"
            demos:
              explore: "Demo: the Hessian per pixel"
          - folder: structure-tensor
            title: "The structure tensor: orientation and corners"
            demos:
              explore: "Demo: the structure tensor"
      - id: bitdepth
        number: 3
        title: "Bit depth and noise"
        plan: "plan/bitdepth-day.md"
        hard: [images]
        soft: []
        owns:
          - "noise models, SNR, PSNR (cameranoise/)"
          - "point operations, gamma/log, histogram equalisation, CLAHE, histogram matching, the cumulative histogram (contrast/)"
          - "integer types and floating point"
        units:
          - folder: quantisation
            title: "Quantisation and bit depth"
            demos:
              explore: "Demo"
          - folder: cameranoise
            title: "Camera noise, SNR and PSNR"
            demos:
              explore: "Demo"
          - folder: highbit
            title: "12- and 16-bit images in practice"
            demos:
              explore: "Demo"
              explore-ct: "Demo: CT windows"
          - folder: contrast
            title: "Contrast and intensity transforms"
            demos:
              explore: "Demo: tone curves"
              explore-equalise: "Demo: equalisation"
              explore-clahe: "Demo: CLAHE"
              explore-measure: "Demo: display vs data"
          - folder: floatingpoint
            title: "Floating point"
            demos:
              explore: "Demo"
              explore-sum: "Demo: summing many pixels"
      - id: imageformation
        number: 4
        title: "Image formation"
        plan: "plan/imageformation-day.md"
        hard: [images]
        soft: [bitdepth, edges]
        owns:
          - "PSF, OTF, sampling/Nyquist in optics, the forward model"
        units:
          - folder: psf
            title: "Image formation and the point spread function"
            demos:
              explore: "Demo"
          - folder: resolution
            title: "Resolution, sampling and measuring the PSF"
            demos:
              explore-twopoints: "Demo: two points on a pixel grid"
              explore-axial: "Demo: the axial PSF"
              explore: "Demo: measuring a PSF from beads"
          - folder: illposed
            title: "Running the model backwards: an ill-posed problem"
            demos:
              explore: "Demo"
      - id: deconvolution
        number: 5
        title: "Deconvolution"
        plan: "plan/deconvolution-day.md"
        hard: [imageformation, bitdepth]
        soft: []
        owns:
          - "deconvolution (inverse filtering, Wiener, Tikhonov, Richardson–Lucy, blind)"
          - "regularisation of inverse problems (data + λ·penalty, choosing λ, early stopping)"
          - "the median as a denoiser"
          - "restoration artefacts"
        units:
          - folder: deconv
            title: "Linear deconvolution: inverse, Wiener, Tikhonov"
            demos:
              explore: "Demo: deconvolution lab"
          - folder: regularise
            title: "Regularisation: what we add, and how much"
            demos:
              explore: "Demo: the regularisation path"
          - folder: richardson-lucy
            title: "Richardson–Lucy, 3D, and the PSF"
            demos:
              explore: "Demo: Richardson–Lucy step by step"
              explore-xz: "Demo: a 3D stack"
          - folder: denoise
            title: "Denoising and what you may measure"
            demos:
              explore: "Demo: denoisers"
              explore-measure: "Demo: what may be measured"
      - id: splines
        number: 6
        title: "Splines and NURBS"
        plan: "plan/splines-day.md"
        hard: [images]
        soft: [deconvolution, labelling]
        owns:
          - "spline theory (Bézier, B-splines, NURBS, smoothing splines)"
        units:
          - folder: bezier
            title: "Polynomial wiggles, piecewise cubics and Bézier curves"
            demos:
              explore-runge: "Demo: Runge's phenomenon"
              explore: "Demo: de Casteljau and joins"
          - folder: bsplines
            title: "B-splines and NURBS"
            demos:
              explore-bsplinebasis: "Demo: B-spline basis functions"
              explore: "Demo: B-spline and NURBS curves"
          - folder: spline-fit
            title: "Interpolating, approximating and smoothing splines"
            demos:
              explore-splinefit: "Demo: interpolate, approximate, smooth"
              explore: "Demo: smooth outlines from pixels"
          - folder: spline-images
            title: "Splines on images: interpolation and free-form deformation"
            demos:
              explore-splinezoom: "Demo: image interpolation beyond bilinear"
              explore: "Demo: free-form deformation"
  - id: "II"
    title: "Transforms and reconstruction"
    colour: "#2f5f9e"
    tint: "#e8eef8"
    days:
      - id: wavelets
        number: 7
        title: "Wavelets"
        plan: "plan/wavelets-day.md"
        hard: [images]
        soft: [bitdepth]
        owns:
          - "Haar, multiresolution, filter banks, the DWT"
          - "wavelet shrinkage (first special case of sparsity)"
        units:
          - folder: haar
            title: "Localised basis functions and the Haar transform"
            demos:
              explore-haarstep: "Demo: the Haar transform step by step"
              explore: "Demo: sparsity in two bases"
          - folder: filterbank
            title: "Multiresolution, filter banks and Daubechies wavelets"
            demos:
              explore: "Demo: the filter bank"
              explore-wavesparse: "Demo: smoother wavelets, sparser coefficients"
          - folder: dwt2d
            title: "The 2D wavelet transform and sparsity of images"
            demos:
              explore: "Demo: subbands, keep the largest, compare bases"
          - folder: shrinkage
            title: "Denoising by wavelet shrinkage"
            demos:
              explore: "Demo: denoising an image"
              explore-1d: "Demo: denoising a 1D signal"
      - id: compression
        number: 8
        title: "Image compression"
        plan: "plan/compression-day.md"
        hard: [wavelets]
        soft: [bitdepth, colour, moments]
        owns:
          - "information and entropy"
          - "DCT, KLT, JPEG"
          - "MSE/PSNR vs SSIM for compression"
        units:
          - folder: entropy
            title: "Information, entropy and entropy codes"
            demos:
              explore: "Demo: build a Huffman code"
          - folder: lossless
            title: "Prediction, dictionaries and lossless formats"
            demos:
              explore: "Demo: prediction and residuals"
          - folder: dct
            title: "Transform coding, the DCT and the KLT"
            demos:
              explore: "Demo: one block in three bases"
              explore-1d: "Demo: periodic or mirrored?"
              explore-basis: "Demo: the whole image, three bases"
          - folder: jpeg
            title: "The JPEG pipeline, artefacts and quality metrics"
            demos:
              explore: "Demo: JPEG"
              explore-ssim: "Demo: same MSE, different quality"
          - folder: compress-science
            title: "Compression and measurements, JPEG 2000, formats"
            demos:
              explore: "Demo: what compression does to measurements"
      - id: radon
        number: 9
        title: "Radon transform and tomography"
        plan: "plan/radon-day.md"
        hard: [images]
        soft: [imageformation, deconvolution, hough, ising]
        owns:
          - "Radon transform"
          - "Fourier slice theorem, filtered back-projection, algebraic reconstruction"
        units:
          - folder: radon
            title: "Projections and the sinogram"
            demos:
              explore: "Demo: projections and the sinogram"
          - folder: backprojection
            title: "Back-projection and the Fourier slice theorem"
            demos:
              explore-backproj: "Demo: back-projection"
              explore: "Demo: the Fourier slice theorem"
          - folder: fbp
            title: "Filtered back-projection and sampling"
            demos:
              explore-fbp: "Demo: filters, dose and padding"
              explore: "Demo: how much data?"
          - folder: algebraic-recon
            title: "Reconstruction as a linear system"
            demos:
              explore-art: "Demo: ART and SIRT by hand"
              explore: "Demo: iterative reconstruction"
      - id: pdesmooth
        number: 10
        title: "Edge-preserving smoothing and PDEs"
        plan: "plan/pdesmooth-day.md"
        hard: [deconvolution, edges]
        soft: [ising, levelsets]
        owns:
          - "nonlinear diffusion, TV flow, explicit-scheme stability for diffusion"
          - "bilateral filter and non-local means in depth"
          - "classical inpainting"
        units:
          - folder: heat-equation
            title: "Smoothing as heat flow: the heat equation and explicit schemes"
            demos:
              explore: "Demo: heat flow, stability and implicit steps"
          - folder: perona-malik
            title: "Edge-stopping diffusion: Perona–Malik"
            demos:
              explore: "Demo: edge-stopping diffusion"
          - folder: tv-flow
            title: "Total variation flow: smoothing as energy descent"
            demos:
              explore: "Demo: TV flow on plateaus, discs and images"
          - folder: bilateral-nlm
            title: "Neighbourhood filters in depth: bilateral and non-local means"
            demos:
              explore: "Demo: bilateral and NLM weight maps"
          - folder: inpainting
            title: "Filling holes: diffusion and exemplar inpainting"
            demos:
              explore: "Demo: inpainting by diffusion, TV and exemplars"
          - folder: smoothers
            title: "All smoothers on one image"
            demos:
              explore: "Demo: eight smoothers compared"
      - id: sparse
        number: 11
        title: "Sparse representations"
        plan: "plan/sparse-day.md"
        hard: [wavelets, deconvolution]
        soft: [compression, radon, ising]
        owns:
          - "sparsity priors in general (ℓ0/ℓ1, lasso, ISTA, compressed sensing, dictionaries)"
        units:
