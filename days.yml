            title: "Sparsity and the ℓ1 penalty"
            demos:
              explore: "Demo: the lasso picture"
          - folder: ista
            title: "Solving with ℓ1: thresholding iterations and pursuit"
            demos:
              explore: "Demo: ISTA, FISTA and OMP"
              explore-sparserestore: "Demo: restoring images with a sparsity prior"
          - folder: compressed-sensing
            title: "Compressed sensing"
            demos:
              explore: "Demo: recovering a sparse signal"
              explore-phasetransition: "Demo: the phase transition"
          - folder: cs-mri
            title: "Fast MRI with compressed sensing"
            demos:
              explore: "Demo: compressed-sensing MRI"
          - folder: dictionaries
            title: "Sparse coding and dictionary learning"
            soft: [dct/]
            demos:
              explore: "Demo: learning a patch dictionary"
              explore-sparserestore: "Demo: restoring with dictionaries"
