<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui, sans-serif" role="img" aria-label="the unbiased counting frame with inclusion and exclusion edges"><rect width="720" height="360" fill="#fff"/><text x="180.0" y="26.0" text-anchor="middle" font-size="19" font-weight="600" fill="#222">unbiased counting frame</text><rect x="30" y="40" width="300" height="300" fill="#f3f3f3" stroke="#999"/><rect x="80" y="90" width="200" height="200" fill="#fff"/><polyline points="80,290 80,90 280,90" fill="none" stroke="#2ca02c" stroke-width="4"/><polyline points="280,40 280,290 30,290" fill="none" stroke="#d62728" stroke-width="4"/><circle cx="110" cy="140" r="22" fill="#9fdcab" stroke="#2a7a3a" stroke-width="2"/><text x="110.0" y="147.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1a5a2a">✓</text><circle cx="82" cy="200" r="20" fill="#9fdcab" stroke="#2a7a3a" stroke-width="2"/><text x="82.0" y="207.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1a5a2a">✓</text><circle cx="220" cy="86" r="18" fill="#9fdcab" stroke="#2a7a3a" stroke-width="2"/><text x="220.0" y="93.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1a5a2a">✓</text><circle cx="280" cy="170" r="20" fill="#ddd" stroke="#888" stroke-width="2"/><text x="280.0" y="177.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a33">✗</text><circle cx="180" cy="294" r="20" fill="#ddd" stroke="#888" stroke-width="2"/><text x="180.0" y="301.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a33">✗</text><circle cx="48" cy="120" r="14" fill="#ddd" stroke="#888" stroke-width="2"/><text x="48.0" y="127.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a33">✗</text><circle cx="290" cy="70" r="16" fill="#ddd" stroke="#888" stroke-width="2"/><text x="290.0" y="77.0" text-anchor="middle" font-size="20" font-weight="700" fill="#a33">✗</text><circle cx="230" cy="230" r="16" fill="#9fdcab" stroke="#2a7a3a" stroke-width="2"/><text x="230.0" y="237.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1a5a2a">✓</text><text x="360.0" y="90.0" text-anchor="start" font-size="17" fill="#222">green: inclusion edges (top, left)</text><text x="360.0" y="120.0" text-anchor="start" font-size="17" fill="#222">red: exclusion line (right and bottom,</text><text x="360.0" y="150.0" text-anchor="start" font-size="17" fill="#222">   extended to the image border)</text><text x="360.0" y="180.0" text-anchor="start" font-size="17" fill="#222">count an object if it hits the frame</text><text x="360.0" y="210.0" text-anchor="start" font-size="17" fill="#222">and does not touch the red line</text><text x="360.0" y="240.0" text-anchor="start" font-size="17" fill="#222"></text><text x="360.0" y="270.0" text-anchor="start" font-size="17" fill="#222">every object of a tiling of frames</text><text x="360.0" y="300.0" text-anchor="start" font-size="17" fill="#222">is counted exactly once</text></svg>
