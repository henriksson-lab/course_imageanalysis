project:
  type: website
  output-dir: docs
  # Built interactive demos (make demos), copied into docs/ on render.
  resources:
    - demos/dist/
  render:
    # Order is set by the sidebar below, not by these globs. One level deep per
    # unit; plan/ holds internal working docs and is excluded from the site.
    - "*.qmd"
    - "*.md"
    - "*/*.qmd"
    - "*/*.md"
    - "!plan/"
    - "!node_modules/"
    - "!demos/"
    # Teacher-only pages: kept in the repo (read them on GitHub), not published.
    - "!README.md"
    - "!audience.md"
    - "!designprinciples.md"

website:
  title: "Image analysis"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: demos.qmd
        text: Demos
  sidebar:
    style: docked
    search: true
    contents:
      - text: Home
        href: index.qmd
      - text: All interactive demos
        href: demos.qmd
