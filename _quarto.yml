      # Order is defined HERE, not in filenames. To reorder a unit, move its
      # block; never rename its folder. styles.css colours leaf links by
      # filename: *lec* → green, *quiz* → blue, #explore → orange.
      # ----------------------------------------------------------------------
      # Parts and days follow plan/coursemap.md; only built units are listed. Parts II
      # (from pixels to objects) and III (aligning images) have no built units yet.
      - section: "Part I: Images as numbers"
        contents:
          - section: "Images, filters and frequencies"
            contents:
              - section: "Images as arrays & geometric transforms"
