format:
  html:
    toc: true
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    theme: cosmo
    css: styles.css
    html-math-method: katex

# Per-page prerequisite links from days.yml: a "Before this unit" box on every quiz and
# exercise page, a "Builds on" line on every lecture's "About this lecture" slide.
filters:
  - tools/prereqs.lua

# reveal.js navigation arrows for every lecture deck (lec.qmd). Plain top-level
# keys, not a `format: revealjs:` block: html pages ignore them, so no page is
# rendered as slides by accident.
controls: true
controls-layout: edges
controls-back-arrows: visible
