project:
  type: website
  output-dir: docs
  # Built interactive demos (make demos), copied into docs/ on render.
  resources:
    - demos/dist/
  render:
    # Order is set by the sidebar below, not by these globs. One level deep per
    # unit; plan/ holds internal working docs and is excluded from the site.
    - "*.qmd"
    - "*.md"
    - "*/*.qmd"
    - "*/*.md"
    - "!plan/"
    - "!node_modules/"
    - "!demos/"
    # Teacher-only pages: kept in the repo (read them on GitHub), not published.
    - "!README.md"
    - "!audience.md"
    - "!designprinciples.md"

website:
  title: "Image analysis"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: demos.qmd
        text: Demos
  sidebar:
    style: docked
    search: true
    contents:
      - text: Home
        href: index.qmd
      - text: All interactive demos
        href: demos.qmd
      # ----------------------------------------------------------------------
      # Order is defined HERE, not in filenames. To reorder a unit, move its
      # block; never rename its folder. styles.css colours leaf links by
      # filename: *lec* → green, *quiz* → blue, #explore → orange.
      # ----------------------------------------------------------------------
      - section: "Part 1: Images, filters and frequencies"
        contents:
          - section: "Images as arrays & geometric transforms"
            contents:
              - text: "Lecture (slides)"
                href: images/lec.qmd
              - text: "Quiz"
                href: images/quiz.qmd
              - text: "Exercise"
                href: images/exercise.qmd
              - text: "Demo: transforming an image"
                href: images/exercise.qmd#explore
          - section: "Filtering & convolution"
            contents:
              - text: "Lecture (slides)"
                href: kernels/lec.qmd
              - text: "Quiz"
                href: kernels/quiz.qmd
              - text: "Exercise"
                href: kernels/exercise.qmd
              - text: "Demo: 3×3 kernels"
                href: kernels/exercise.qmd#explore
          - section: "Images in frequency space"
            contents:
              - text: "Lecture (slides)"
                href: fourier/lec.qmd
              - text: "Quiz"
                href: fourier/quiz.qmd
              - text: "Exercise"
                href: fourier/exercise.qmd
              - text: "Demo: build a wave"
                href: fourier/exercise.qmd#explore-wave
              - text: "Demo: filtering in Fourier space"
                href: fourier/exercise.qmd#explore
      - section: "Part 2: Segmentation with graphs"
        contents:
          - section: "Segmentation as energy minimisation"
            contents:
              - text: "Lecture (slides)"
                href: seg-energy/lec.qmd
              - text: "Quiz"
                href: seg-energy/quiz.qmd
              - text: "Exercise"
                href: seg-energy/exercise.qmd
              - text: "Demo: energy of a line profile"
                href: seg-energy/exercise.qmd#explore
          - section: "Graphs, cuts and maximum flow"
            contents:
              - text: "Lecture (slides)"
                href: maxflow/lec.qmd
              - text: "Quiz"
                href: maxflow/quiz.qmd
              - text: "Exercise"
                href: maxflow/exercise.qmd
              - text: "Demo: augmenting paths"
                href: maxflow/exercise.qmd#explore
          - section: "Graph-cut segmentation"
            contents:
              - text: "Lecture (slides)"
                href: graphcut-seg/lec.qmd
              - text: "Quiz"
                href: graphcut-seg/quiz.qmd
              - text: "Exercise"
                href: graphcut-seg/exercise.qmd
              - text: "Demo: the graph of a small image"
                href: graphcut-seg/exercise.qmd#explore-graph
              - text: "Demo: interactive graph cut"
                href: graphcut-seg/exercise.qmd#explore
          - section: "Spectral partitioning & normalized cuts"
            contents:
              - text: "Lecture (slides)"
                href: ncut/lec.qmd
              - text: "Quiz"
                href: ncut/quiz.qmd
              - text: "Exercise"
                href: ncut/exercise.qmd
              - text: "Demo: Fiedler vectors and normalized cuts"
                href: ncut/exercise.qmd#explore

format:
  html:
    toc: true
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    theme: cosmo
    css: styles.css
    html-math-method: katex

# reveal.js navigation arrows for every lecture deck (lec.qmd). Plain top-level
# keys, not a `format: revealjs:` block: html pages ignore them, so no page is
# rendered as slides by accident.
controls: true
controls-layout: edges
controls-back-arrows: visible
