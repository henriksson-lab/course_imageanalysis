<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="sans-serif" font-size="20" role="img" aria-label="EM as a loop: from the Gaussians the E-step computes soft labels by Bayes' rule; from the soft labels the M-step refits each Gaussian with weighted means and covariances">
<rect width="640" height="400" fill="#fff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<!-- Gaussians box -->
<rect x="190" y="14" width="260" height="118" rx="14" fill="#eef4fa" stroke="#1f77b4" stroke-width="2.5"/>
<text x="320" y="44" text-anchor="middle" font-weight="bold">Gaussians</text>
<text x="320" y="70" text-anchor="middle" fill="#333" font-size="18">weights, means, covariances</text>
<ellipse cx="285" cy="102" rx="34" ry="14" fill="none" stroke="#1f77b4" stroke-width="2.5" transform="rotate(-20 285 102)"/>
<ellipse cx="360" cy="102" rx="22" ry="16" fill="none" stroke="#ff7f0e" stroke-width="2.5"/>
<!-- labels box -->
<rect x="190" y="266" width="260" height="118" rx="14" fill="#fff4ea" stroke="#ff7f0e" stroke-width="2.5"/>
<text x="320" y="296" text-anchor="middle" font-weight="bold">soft labels</text>
<text x="320" y="322" text-anchor="middle" fill="#333">responsibilities r<tspan baseline-shift="sub" font-size="15">ik</tspan></text>
<rect x="250" y="340" width="98" height="22" fill="#1f77b4"/><rect x="348" y="340" width="42" height="22" fill="#ff7f0e"/>
<text x="299" y="357" text-anchor="middle" fill="#fff" font-size="16">70 %</text><text x="369" y="357" text-anchor="middle" fill="#fff" font-size="16">30 %</text>
<!-- arrows -->
<path d="M190,80 C90,110 90,290 190,320" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M450,320 C550,290 550,110 450,80" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="104" y="190" text-anchor="end" font-weight="bold">E-step</text>
<text x="104" y="216" text-anchor="end" fill="#333" font-size="17">Bayes' rule</text>
<text x="536" y="190" font-weight="bold">M-step</text>
<text x="536" y="216" fill="#333" font-size="17">weighted</text>
<text x="536" y="238" fill="#333" font-size="17">fit</text>
</svg>
