<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../demos/dist/demo.css">
<style>body{margin:0;padding:10px;background:#fff;font-family:sans-serif;width:1260px}</style></head><body>
<script>
const q=new URLSearchParams(location.search);
document.write('<div data-demo="'+q.get('demo')+'" data-preset="'+(q.get('preset')||'')+'"></div>');
document.write('<script src="../demos/dist/'+q.get('demo')+'.js"><\/script>');
function tweak(){
  for(const b of (q.get('b')||'').split('|').filter(x=>x)){
    const btn=[...document.querySelectorAll('button')].find(x=>x.textContent.trim()===b); if(btn) btn.click(); else console.log('nobtn',b);}
  for(const kv of (q.get('s')||'').split('|').filter(x=>x)){
    const [k,v]=kv.split('=');
    const lab=[...document.querySelectorAll('.qb-slider')].find(l=>l.querySelector('.qb-slider-name').textContent.trim()===k);
    if(!lab){console.log('noslider',k);continue;}
    const inp=lab.querySelector('input'); inp.value=v; inp.dispatchEvent(new Event('input'));}
  for(const kv of (q.get('c')||'').split('|').filter(x=>x)){
    const lab=[...document.querySelectorAll('label')].find(l=>l.textContent.trim()===kv); const i=lab&&lab.querySelector('input'); if(i){i.click();}}
}
document.write('<script>document.addEventListener("DOMContentLoaded",tweak);<\/script>');
</script></body></html>
