<!doctype html>
<!-- Screenshot harness for the cellpose/ slide figures: one demo with data-* attributes from
     the query string, e.g. demo_shot.html?d=cellposenet&sample=nuclei&view=flows&autorun=1.
     Served from a folder that has the repository's demos/ next to it (see demo_shot.sh). -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="demos/dist/demo.css">
<style>body{margin:0;background:#fff;font-family:sans-serif;width:1200px;padding:10px}</style></head><body>
<div id="host"></div>
<script>
const q = new URLSearchParams(location.search);
const d = document.getElementById('host');
for (const [k, v] of q) if (k === 'd') d.dataset.demo = v; else d.dataset[k] = v;
const s = document.createElement('script'); s.src = 'demos/dist/' + q.get('d') + '.js'; document.body.appendChild(s);
</script></body></html>
