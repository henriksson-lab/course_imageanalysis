<!doctype html>
<!-- Screenshot harness for the modern-deep-learning-day slide figures: shows one demo in one
     preset, e.g. demo_shot.html?d=instancemaps&p=gap. Served from a folder that has the
     repository's demos/ next to it (see demo_shot.sh). -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="demos/dist/demo.css">
<style>body{margin:0;background:#fff;font-family:sans-serif;width:1200px;padding:10px}</style></head><body>
<div id="host"></div>
<script>
const q = new URLSearchParams(location.search);
const d = document.getElementById('host'); d.dataset.demo = q.get('d'); d.dataset.preset = q.get('p');
const s = document.createElement('script'); s.src = 'demos/dist/' + q.get('d') + '.js'; document.body.appendChild(s);
</script></body></html>
