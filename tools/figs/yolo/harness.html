<!doctype html>
<!-- Screenshot harness for the yolo/ figures: one demo in one preset, e.g. h.html?d=yolodecode&p=b1
     (&i=<data-image>). Served next to the repository's demos/ by tools/figs/yolo/cdp.py. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="demos/dist/demo.css">
<style>body{margin:0;background:#fff;font-family:sans-serif;width:1200px;padding:10px}</style></head><body>
<div id="host"></div>
<script>
const q = new URLSearchParams(location.search);
const d = document.getElementById('host'); d.dataset.demo = q.get('d');
if (q.get('p')) d.dataset.preset = q.get('p');
if (q.get('i')) d.dataset.image = q.get('i');
const s = document.createElement('script'); s.src = 'demos/dist/' + q.get('d') + '.js'; document.body.appendChild(s);
</script></body></html>
