# Deploy the course site to GitHub Pages (Settings -> Pages -> Source: "GitHub Actions").
# The site is the committed docs/ (rendered locally with `make render`) plus what is never
# committed: the Wasm modules (make wasm -> demos/dist/wasm/) and the model weights and
# sample images (make models -> demos/dist/models/), placed under demos/dist/ of the site.
# A commit that fails the type check or the tests is not deployed.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ---- Node (esbuild, typescript) ----
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ---- Rust -> WebAssembly ----
      - name: Rust toolchain with the wasm32 target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: wasm-bindgen version pinned by the crates
        run: |
          v=$(grep -hoE '^wasm-bindgen *= *"=[0-9.]+"' demos/wasm/*/Cargo.toml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "WASM_BINDGEN_VERSION=$v" >> "$GITHUB_ENV"
          echo "wasm-bindgen $v"
      - name: Cache wasm-bindgen CLI
        id: wbcache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ runner.os }}-${{ env.WASM_BINDGEN_VERSION }}
      - name: Install wasm-bindgen CLI
        if: steps.wbcache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - name: Cache cargo registry and Wasm build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            demos/wasm/target
          key: wasm-target-${{ runner.os }}-${{ hashFiles('demos/wasm/*/Cargo.lock', 'demos/wasm/*/Cargo.toml') }}
          restore-keys: wasm-target-${{ runner.os }}-

      # ---- Python (model download and conversion) ----
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/models/requirements.txt
      - name: Python packages (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r tools/models/requirements.txt

      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ hashFiles('tools/models/manifest.json', 'tools/models/fetch.py') }}
          restore-keys: models-

      # ---- Build and check ----
      - name: Build Wasm modules
        run: make wasm
      - name: Type check
        run: make typecheck
      - name: Fetch and convert models and sample images
        run: make models
      - name: Tests
        run: make test
        env:
          WASM_REQUIRED: "1"

      # ---- Assemble the site ----
      - name: Assemble _site (committed docs/ + wasm + models)
        run: |
          rm -rf _site
          mkdir -p _site
          cp -a docs/. _site/
          mkdir -p _site/demos/dist
          rm -rf _site/demos/dist/wasm _site/demos/dist/models
          cp -a demos/dist/wasm _site/demos/dist/wasm
          cp -a demos/dist/models _site/demos/dist/models
          rm -f _site/demos/dist/wasm/package.json
          touch _site/.nojekyll
          size=$(du -sm _site | cut -f1)
          echo "site size: ${size} MB"
          du -sh _site/demos/dist/wasm _site/demos/dist/models
          if [ "$size" -gt 950 ]; then echo "::error::site is ${size} MB, over the GitHub Pages limit (~1 GB)"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
