# SAM 2.1 (Hiera tiny) in the browser: a thin wasm-bindgen wrapper around the henriksson-lab
# crate sam2-rs (candle, CPU). Built by `make wasm` into demos/dist/wasm/sam/ (fetched, not
# inlined: the module is a few MB). Used by demos/src/samnet/; tested by demos/test/sam-wasm-test.ts.
# See README.md (API, benchmark).
[package]
name = "sam"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Must equal the wasm-bindgen CLI version exactly (demos/wasm/build.sh checks it).
wasm-bindgen = "=0.2.128"
# sam2-rs is a patched copy (vendor/README.md), at the commit of the converter pinned in
# tools/models/manifest.json ("tools" -> "sam2-rs"). Candle is used as published, from the
# mahogny/candle fork (branch integration/stardist-clearmap-ops, 2026-11-13), the same
# revision as demos/wasm/stardist and as the vendored sam2-rs (whose upstream pins 0998c8c,
# which does not compile for wasm32), so one Candle is built.
sam2-rs = { path = "vendor/sam2-rs" }
candle-nn = { git = "https://github.com/mahogny/candle.git", rev = "2512982e1f879939d25b60797913761876c49465" }
candle-core = { git = "https://github.com/mahogny/candle.git", rev = "2512982e1f879939d25b60797913761876c49465" }

# Candle pulls in rand -> getrandom 0.3, which compiles for wasm32-unknown-unknown only with its
# `wasm_js` feature (crypto.getRandomValues; the model itself never draws random numbers).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
# 3, not the usual "s": the encoder is compute-bound; measured 7 % faster (25.1 vs 27.0 s per
# image in node) for 0.5 MB more module (2.56 vs 2.02 MB).
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
