# Vendored copy of the library part of github.com/henriksson-lab/sam2-rs at rev
# edb4cb76cfd85bdc69915893a9addea7ebe3bd62 (src/ without src/bin/, and manifests/), with one
# mechanical patch so it runs on wasm32: std::time::Instant -> crate::clock::Instant (see
# ../README.md). Candle moved from upstream's pin (rev 0998c8c, which does not compile for
# wasm32) to rev 2512982, the revision ../../Cargo.toml uses. The CUDA build script and the
# optional features (Hugging Face download, image/video decoding, CUDA, MKL) are left out.
[package]
name = "sam2-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Rust implementation of Meta SAM2, initially using Candle"
license = "Apache-2.0"
publish = false

[dependencies]
candle-core = { git = "https://github.com/mahogny/candle.git", rev = "2512982e1f879939d25b60797913761876c49465" }
candle-nn = { git = "https://github.com/mahogny/candle.git", rev = "2512982e1f879939d25b60797913761876c49465" }
safetensors = "0.8.0"
thiserror = "2"
rayon = "1.11"

[features]
default = []
# Declared (empty) only so the #[cfg(feature = ...)] blocks of the original sources stay valid;
# never enabled here.
cuda = []
huggingface = []
image-decoding = []
video-decoding = []
cpu-flash-attention = []

[lints.rust]
unexpected_cfgs = "allow"
