# Vendored copy of candle-nn from github.com/mahogny/candle at rev
# 0998c8c655ae84330149ddbff509916254b887a1 (the revision sam2-rs pins), with one patch so it
# compiles for wasm32: see ../README.md. Only src/ and the licences are kept.
[package]
name = "candle-nn"
version = "0.11.0"
edition = "2021"
description = "Minimalist ML framework."
repository = "https://github.com/huggingface/candle"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
candle = { git = "https://github.com/mahogny/candle.git", rev = "0998c8c655ae84330149ddbff509916254b887a1", package = "candle-core" }
gemm = { git = "https://github.com/mahogny/gemm.git", rev = "a9ea398a74911f4a0cc79261044cbdf4ce9efd91", features = ["wasm-simd128-enable", "x86-v4"] }
half = { version = "2.5.0", features = ["num-traits", "use-intrinsics", "rand_distr", "zerocopy"] }
thiserror = "2"
num-traits = "0.2.15"
rayon = "1.7.0"
safetensors = "0.8.0"
serde = { version = "1.0.171", features = ["derive"] }
libc = { version = "0.2.147" }

[features]
default = []
cuda = ["candle/cuda"]
cudnn = ["candle/cudnn"]
mkl = ["candle/mkl"]
glibc-vector-math = ["candle/glibc-vector-math"]
metal = []
