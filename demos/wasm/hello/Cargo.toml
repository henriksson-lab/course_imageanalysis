# Example crate for the Wasm pipeline (demos/wasm/README.md): built by `make wasm`
# into demos/dist/wasm/hello/ (hello.js glue + hello_bg.wasm). Tested by demos/test/wasm-test.ts.
[package]
name = "hello"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Must equal the wasm-bindgen CLI version exactly (demos/wasm/build.sh checks it).
wasm-bindgen = "=0.2.128"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
