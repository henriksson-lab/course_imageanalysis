# YOLO11 nano in the browser: the YOLOv11-rs model (henriksson-lab, Burn) compiled to
# wasm32 on Burn's portable CPU backend (burn-flex, SIMD128), behind a few flat-array
# functions for demos/src/yolonet/. Built by `make wasm` into demos/dist/wasm/yolo/.
# See README.md (what is vendored and why, benchmark).
[package]
name = "yolo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# cdylib for wasm-bindgen; rlib so the native reference example can use the same code.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Must equal the wasm-bindgen CLI version exactly (demos/wasm/build.sh checks it).
wasm-bindgen = "=0.2.128"
# The Burn revision YOLOv11-rs builds against (its Cargo.toml patches crates.io Burn with
# github.com/mahogny/burn; DEPENDENCY_SECURITY.md pins this commit). No default features:
# only the CPU backend (burn-flex) and safetensors loading, no GPU, no threads, no SQLite.
burn = { git = "https://github.com/mahogny/burn", rev = "e20ada6837eaadf59e2e78efd572788c178c9bd5", default-features = false, features = ["std", "flex", "simd"] }
# f16 checkpoints are widened to f32 before loading (burn-flex keeps the stored dtype).
half = "2"
serde_json = "1"
burn-store = { git = "https://github.com/mahogny/burn", rev = "e20ada6837eaadf59e2e78efd572788c178c9bd5", default-features = false, features = ["std", "safetensors"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Burn pulls rand (and so getrandom) even for inference; on wasm32-unknown-unknown getrandom
# needs its JavaScript backend switched on (no random numbers are used at inference).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
