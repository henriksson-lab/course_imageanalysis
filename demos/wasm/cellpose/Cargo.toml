# Cellpose 3 (cyto3 / nuclei U-net) in the browser: the network forward pass and the flow
# decoding (Euler tracking to sinks, seeds, masks, flow-error check, hole filling), as plain
# numeric functions over flat arrays. Built by `make wasm` into demos/dist/wasm/cellpose/.
# Used by demos/src/cellposenet/, tested by demos/test/cellpose-wasm-test.ts. See README.md.
[package]
name = "cellpose"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Must equal the wasm-bindgen CLI version exactly (demos/wasm/build.sh checks it).
wasm-bindgen = "=0.2.128"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
