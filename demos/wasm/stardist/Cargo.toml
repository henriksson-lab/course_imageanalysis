# StarDist 2D in the browser (demos/src/stardistnet/): wraps henriksson-lab/stardist-rs
# (network on the candle CPU backend, polygon NMS, polygons -> labels) behind a few
# flat-array functions. Built by `make wasm` into demos/dist/wasm/stardist/.
[package]
name = "stardist"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Must equal the wasm-bindgen CLI version exactly (demos/wasm/build.sh checks it).
wasm-bindgen = "=0.2.128"
stardist-rs = { git = "https://github.com/henriksson-lab/stardist-rs", rev = "20cb2375f53540ad0f2b490d4e8a7f65d96c95ee", default-features = false, features = ["candle"] }
candle-core = "0.11"
serde_json = "1"

# candle pulls rand -> getrandom 0.3, which needs its JS backend on wasm32-unknown-unknown
# (feature only; nothing in inference draws random numbers).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# stardist-rs builds against this candle fork (its own [patch] does not reach dependents).
[patch.crates-io]
candle-core = { git = "https://github.com/mahogny/candle.git", branch = "pr/stardist-candle-integration" }
candle-nn = { git = "https://github.com/mahogny/candle.git", branch = "pr/stardist-candle-integration" }

[dev-dependencies]
# Native reference tests (tests/native.rs): the crate's own HDF5 loader to check src/h5.rs.
stardist-rs = { git = "https://github.com/henriksson-lab/stardist-rs", rev = "20cb2375f53540ad0f2b490d4e8a7f65d96c95ee", default-features = false, features = ["candle", "hdf5"] }
image = { version = "0.25", default-features = false, features = ["png"] }
