# Maximum flow / minimum s-t cut for the graph-cut demo (demos/src/graphcut/): the same results
# as demos/src/lib/maxflow.ts (FlowGraph: addEdge, maxflow, sourceSide, flow), solved with the
# Boykov-Kolmogorov algorithm instead of Dinic, plus GridCut, the graph-cut segmentation of
# lib/graph.ts solveSeg() with the graph built once and kept between solves. Exported as handle
# functions (graph_*, grid_*), wrapped in TypeScript classes by demos/src/graphcut/wasmapi.ts.
# Built by `make wasm` into demos/dist/wasm/maxflow/; tested by demos/test/maxflow-wasm-test.ts.
# opt-level 3 (not "s"): the max-flow loop is the hot path, and the module is small (~37 kB).
[package]
name = "maxflow"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Must equal the wasm-bindgen CLI version exactly (demos/wasm/build.sh checks it).
wasm-bindgen = "=0.2.128"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
