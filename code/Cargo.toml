# The course's Rust code: the small image library and one project per unit.
# Build and test everything from this folder: cargo test   (see README.md)
[workspace]
resolver = "2"
members = [
    "imgcourse",
    "starter",
    "day01-images",
    "day02-edges",
    "day03-bitdepth",
    "day04-imageformation",
    "day05-deconvolution",
    "day06-splines",
    "day07-wavelets",
    "day08-compression",
    "day09-radon",
    "day10-pdesmooth",
    "day11-sparse",
    "day12-thresholding",
    "day13-morphology",
    "day14-labelling",
    "day15-watershed",
    "day16-measurements",
    "day17-skeleton",
    "day18-moments",
    "day19-spatialstats",
    "day20-pointdetection",
    "day21-hough",
    "day22-integral",
    "day23-fftreg",
    "day24-keypoints",
    "day25-opticalflow",
    "day26-tracking",
    "day27-graphcuts",
    "day28-ising",
    "day29-graphseg",
    "day30-snakes",
    "day31-levelsets",
    "day32-dynprog",
    "day33-randomforest",
    "day34-svm",
    "day35-gmm",
    "day36-neuralnets",
    "day37-evaluation",
    "day38-vae",
    "day39-moderndl",
    "day40-cellnets",
    "day41-diffusion",
    "day42-colour",
    "day43-unmixing",
    "day44-colocalisation",
    "day45-fret",
    "day46-flim",
    "day47-marchingcubes",
    "day48-graphics3d",
    "day49-multiview",
    "day50-raytracing",
    "day51-gpus",
]

# The exercise programs work on whole images with plain loops: compile them with
# optimisation even in a normal (debug) build, so that they run in about a second.
[profile.dev]
opt-level = 1
# Line numbers in panics and backtraces, but no full debug information: without this every
# program is ~56 MB (mostly debug data of the image-file packages).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# The library is read through on every pixel access: full optimisation for it as well.
[profile.dev.package.imgcourse]
opt-level = 3
