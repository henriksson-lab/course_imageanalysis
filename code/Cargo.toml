# The course's Rust code: the small image library and one project per unit.
# Build and test everything from this folder: cargo test   (see README.md)
[workspace]
resolver = "2"
members = [
    "imgcourse",
    "starter",
    "images",
    "edges",
    "bitdepth",
    "imageformation",
    "deconvolution",
    "splines",
    "wavelets",
    "compression",
    "radon",
    "pdesmooth",
    "sparse",
    "thresholding",
    "morphology",
    "labelling",
    "watershed",
    "measurements",
    "skeleton",
    "moments",
    "spatialstats",
    "pointdetection",
    "hough",
    "integral",
    "fftreg",
    "shapematch",
    "keypoints",
    "opticalflow",
    "tracking",
    "graphcuts",
    "ising",
    "graphseg",
    "snakes",
    "levelsets",
    "dynprog",
    "randomforest",
    "svm",
    "gmm",
    "neuralnets",
    "training",
    "evaluation",
    "vae",
    "gans",
    "moderndl",
    "selfsup",
    "cellnets",
    "finetuning",
    "diffusion",
    "colour",
    "unmixing",
    "colocalisation",
    "fret",
    "flim",
    "marchingcubes",
    "graphics3d",
    "multiview",
    "raytracing",
    "gpus",
]

# The exercise programs work on whole images with plain loops: compile them with
# optimisation even in a normal (debug) build, so that they run in about a second.
[profile.dev]
opt-level = 1
# Line numbers in panics and backtraces, but no full debug information: without this every
# program is ~56 MB (mostly debug data of the image-file packages).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# The library is read through on every pixel access: full optimisation for it as well.
[profile.dev.package.imgcourse]
opt-level = 3
