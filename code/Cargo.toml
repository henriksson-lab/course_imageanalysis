# The exercise programs work on whole images with plain loops: compile them with
# optimisation even in a normal (debug) build, so that they run in about a second.
[profile.dev]
opt-level = 1
# Line numbers in panics and backtraces, but no full debug information: without this every
# program is ~56 MB (mostly debug data of the image-file packages).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# The library is read through on every pixel access: full optimisation for it as well.
[profile.dev.package.imgcourse]
opt-level = 3
