# The course's Rust code: the small image library and one project per unit.
# Build and test everything from this folder: cargo test   (see README.md)
[workspace]
resolver = "2"
members = [
    "imgcourse",
    "starter",
    "images",
    "kernels",
    "fourier",
    "pca",
]

# The exercise programs work on whole images with plain loops: compile them with
# optimisation even in a normal (debug) build, so that they run in about a second.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
