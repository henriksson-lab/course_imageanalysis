[package]
name = "imgcourse"
version = "0.1.0"
edition = "2021"
description = "A small image type for the image analysis course: easy to read, not fast."
license = "MIT"

[dependencies]
# Only used to read and write image files; the course code never sees its types.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
