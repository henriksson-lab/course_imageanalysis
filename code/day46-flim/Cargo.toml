[package]
name = "day46"
version = "0.1.0"
edition = "2021"
description = "Coding exercises for day 46: Fluorescence lifetime imaging (FLIM)"

# Your code goes in src/<unit>/exercise.rs. To use the model solutions (src/<unit>/solution.rs):
#   cargo test -p day46 --features solution
[features]
solution = []

[lib]
test = false
doctest = false

[[bin]]
name = "day46"
path = "src/main.rs"
test = false

[dependencies]
imgcourse = { path = "../imgcourse" }
clap = { version = "4.5", features = ["derive"] }
