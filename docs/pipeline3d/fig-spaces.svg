<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 170" font-family="sans-serif" font-size="20">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <g fill="#eef3fa" stroke="#1f77b4" stroke-width="2">
    <rect x="5" y="40" width="140" height="70" rx="10"/><rect x="230" y="40" width="140" height="70" rx="10"/>
    <rect x="455" y="40" width="140" height="70" rx="10"/><rect x="680" y="40" width="140" height="70" rx="10"/>
    <rect x="905" y="40" width="190" height="70" rx="10"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="75" y="72">model</text><text x="75" y="98" font-size="16" fill="#555">object's own axes</text>
    <text x="300" y="72">world</text><text x="300" y="98" font-size="16" fill="#555">the scene</text>
    <text x="525" y="72">view</text><text x="525" y="98" font-size="16" fill="#555">camera at 0, −z ahead</text>
    <text x="750" y="72">clip → NDC</text><text x="750" y="98" font-size="16" fill="#555">divide by w</text>
    <text x="1000" y="72">screen</text><text x="1000" y="98" font-size="16" fill="#555">pixels + depth</text>
  </g>
  <g stroke="#333" stroke-width="2.5" marker-end="url(#a)">
    <line x1="148" y1="75" x2="226" y2="75"/><line x1="373" y1="75" x2="451" y2="75"/>
    <line x1="598" y1="75" x2="676" y2="75"/><line x1="823" y1="75" x2="901" y2="75"/>
  </g>
  <g text-anchor="middle" fill="#c0392b" font-size="22" font-style="italic">
    <text x="187" y="30">M</text><text x="412" y="30">V</text><text x="637" y="30">P</text><text x="862" y="30" font-size="16">viewport</text>
  </g>
  <text x="550" y="155" text-anchor="middle" font-size="18" fill="#333">one product per object: clip = P V M x, then x/w, y/w, z/w, then scale to pixels</text>
</svg>
