<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <style>
    .box { fill: #f6f7f9; stroke: #444; stroke-width: 2; }
    .op { fill: #e8f1fa; stroke: #1f77b4; stroke-width: 2; }
    .ln { stroke: #444; stroke-width: 2.5; fill: none; marker-end: url(#ar); }
    text { fill: #222; }
    .small { font-size: 18px; fill: #555; }
  </style>
  <rect class="box" x="10" y="30" width="140" height="60" rx="8"/><text x="80" y="68" text-anchor="middle">image A</text>
  <rect class="box" x="10" y="190" width="140" height="60" rx="8"/><text x="80" y="228" text-anchor="middle">image B</text>
  <rect class="op" x="200" y="30" width="110" height="60" rx="8"/><text x="255" y="68" text-anchor="middle">FFT</text>
  <rect class="op" x="200" y="190" width="110" height="60" rx="8"/><text x="255" y="228" text-anchor="middle">FFT</text>
  <rect class="box" x="360" y="30" width="120" height="60" rx="8"/><text x="420" y="68" text-anchor="middle">A<tspan font-size="16" dy="6">k</tspan></text>
  <rect class="box" x="360" y="190" width="120" height="60" rx="8"/><text x="420" y="228" text-anchor="middle">conj(B<tspan font-size="16" dy="6">k</tspan><tspan dy="-6">)</tspan></text>
  <rect class="op" x="540" y="110" width="150" height="60" rx="8"/><text x="615" y="148" text-anchor="middle">multiply</text>
  <rect class="op" x="740" y="110" width="110" height="60" rx="8"/><text x="795" y="140" text-anchor="middle">inverse</text><text x="795" y="162" text-anchor="middle">FFT</text>
  <text x="950" y="135" text-anchor="middle">c(t) for</text><text x="950" y="160" text-anchor="middle">every t</text>
  <path class="ln" d="M150,60 H196"/><path class="ln" d="M150,220 H196"/>
  <path class="ln" d="M310,60 H356"/><path class="ln" d="M310,220 H356"/>
  <path class="ln" d="M480,60 C510,60 510,128 536,132"/><path class="ln" d="M480,220 C510,220 510,152 536,148"/>
  <path class="ln" d="M690,140 H736"/><path class="ln" d="M850,140 H888"/>
  <text x="545" y="100" text-anchor="start" class="small">one product per frequency k</text>
  <text x="255" y="285" text-anchor="middle" class="small">≈ N log N each</text>
  <text x="795" y="205" text-anchor="middle" class="small">≈ N log N</text>
</svg>
