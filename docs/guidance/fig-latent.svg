<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" width="500" height="440" font-family="DejaVu Sans, sans-serif" font-size="18">
<!-- Hand-written diagram for guidance/lec.qmd, slide "Latent diffusion". -->
<rect width="500" height="440" fill="#fff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#333"/></marker></defs>
<text x="6" y="24" font-weight="bold">1. train: encode the training images</text>
<rect x="6" y="40" width="150" height="70" rx="6" fill="#e8f1f8" stroke="#0072B2" stroke-width="2"/>
<text x="81" y="69" text-anchor="middle">image</text>
<text x="81" y="94" text-anchor="middle">256×256×3</text>
<line x1="156" y1="75" x2="276" y2="75" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="216" y="64" text-anchor="middle">encoder</text>
<rect x="280" y="40" width="150" height="70" rx="6" fill="#fdf1dc" stroke="#E69F00" stroke-width="2"/>
<text x="355" y="69" text-anchor="middle">code</text>
<text x="355" y="94" text-anchor="middle">32×32×4</text>
<text x="280" y="136">48× fewer numbers;</text>
<text x="280" y="160">the codes form a cloud</text>
<text x="6" y="210" font-weight="bold">2. generate: diffusion, then decode</text>
<rect x="6" y="226" width="150" height="70" rx="6" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="2"/>
<text x="81" y="255" text-anchor="middle">noise</text>
<text x="81" y="280" text-anchor="middle">32×32×4</text>
<line x1="156" y1="261" x2="276" y2="261" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="216" y="250" text-anchor="middle">diffusion</text>
<text x="216" y="287" text-anchor="middle" font-size="17">cheap steps</text>
<rect x="280" y="226" width="150" height="70" rx="6" fill="#fdf1dc" stroke="#E69F00" stroke-width="2"/>
<text x="355" y="255" text-anchor="middle">new code</text>
<text x="355" y="280" text-anchor="middle">32×32×4</text>
<line x1="355" y1="296" x2="355" y2="350" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="365" y="330">decoder</text>
<rect x="280" y="354" width="150" height="70" rx="6" fill="#e8f1f8" stroke="#0072B2" stroke-width="2"/>
<text x="355" y="383" text-anchor="middle">image</text>
<text x="355" y="408" text-anchor="middle">256×256×3</text>
<text x="268" y="383" text-anchor="end" fill="#D55E00">finest detail:</text>
<text x="268" y="408" text-anchor="end" fill="#D55E00">the decoder's habits</text>
</svg>
