<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 440" width="430" height="440" font-family="DejaVu Sans, sans-serif" font-size="20">
<!-- Hand-written diagram for diffusion-inverse/lec.qmd, slide "Sampling the posterior with a diffusion model":
     one step of posterior sampling with the clean-estimate trick. -->
<rect width="430" height="440" fill="#fff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#333"/></marker></defs>
<rect x="4" y="6" width="320" height="54" rx="6" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="2"/>
<text x="164" y="40" text-anchor="middle">noisy image, level t</text>
<line x1="80" y1="60" x2="80" y2="96" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="92" y="86" font-size="19">denoiser (prior)</text>
<rect x="4" y="100" width="320" height="54" rx="6" fill="#e8f1f8" stroke="#0072B2" stroke-width="2"/>
<text x="164" y="134" text-anchor="middle">clean estimate x̂₀</text>
<line x1="80" y1="154" x2="80" y2="190" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="92" y="180" font-size="19">re-measure it</text>
<rect x="4" y="194" width="320" height="54" rx="6" fill="#fdf1dc" stroke="#E69F00" stroke-width="2"/>
<text x="164" y="228" text-anchor="middle">compare with y</text>
<line x1="80" y1="248" x2="80" y2="284" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="92" y="274" font-size="19" fill="#D55E00">over-confident early</text>
<rect x="4" y="288" width="320" height="54" rx="6" fill="#fdf1dc" stroke="#E69F00" stroke-width="2"/>
<text x="164" y="322" text-anchor="middle">push towards agreement</text>
<line x1="80" y1="342" x2="80" y2="378" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<rect x="4" y="382" width="320" height="54" rx="6" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="2"/>
<text x="164" y="416" text-anchor="middle">step to lower noise</text>
<path d="M324,409 H380 V33 H330" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
<text x="402" y="221" text-anchor="middle" font-size="19" transform="rotate(90 402 221)">repeat until t = 0</text>
</svg>
