<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 200" font-family="sans-serif" font-size="20">
<rect width="1100" height="200" fill="white"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect x="10" y="30" width="190" height="80" rx="10" fill="#eef4fb" stroke="#1f77b4" stroke-width="2.5"/>
<text x="105" y="64" text-anchor="middle" font-weight="700">tiles</text><text x="105" y="92" text-anchor="middle" font-size="16">optional</text>
<line x1="202" y1="70" x2="224" y2="70" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="226" y="30" width="190" height="80" rx="10" fill="#eef4fb" stroke="#1f77b4" stroke-width="2.5"/>
<text x="321" y="64" text-anchor="middle" font-weight="700">wavelet</text><text x="321" y="92" text-anchor="middle" font-size="16">5 levels; 5/3 or 9/7</text>
<line x1="418" y1="70" x2="440" y2="70" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="442" y="30" width="190" height="80" rx="10" fill="#ffe2c6" stroke="#ff7f0e" stroke-width="2.5"/>
<text x="537" y="64" text-anchor="middle" font-weight="700">quantise</text><text x="537" y="92" text-anchor="middle" font-size="16">dead zone (9/7 only)</text>
<line x1="634" y1="70" x2="656" y2="70" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="658" y="30" width="190" height="80" rx="10" fill="#eef4fb" stroke="#1f77b4" stroke-width="2.5"/>
<text x="753" y="64" text-anchor="middle" font-weight="700">bit planes</text><text x="753" y="92" text-anchor="middle" font-size="16">most significant first</text>
<line x1="850" y1="70" x2="872" y2="70" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="874" y="30" width="190" height="80" rx="10" fill="#eef4fb" stroke="#1f77b4" stroke-width="2.5"/>
<text x="969" y="64" text-anchor="middle" font-weight="700">arithmetic</text><text x="969" y="92" text-anchor="middle" font-size="16">context coder</text>
<text x="550" y="150" text-anchor="middle" font-size="18">the code stream can be cut anywhere: lower rate, lower resolution or one region, from one file</text>
<text x="550" y="180" text-anchor="middle" font-size="17" fill="#555">reversible integer 5/3 wavelet + no quantisation = exactly lossless</text>
</svg>
